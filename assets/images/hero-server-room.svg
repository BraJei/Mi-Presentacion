<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="75%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#0F172A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Monitor Glow -->
    <linearGradient id="screenCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="screenBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="1920" height="1080" fill="#030712" />
  <rect width="1920" height="1080" fill="url(#bgGlow)" />

  <!-- Server Racks (Right Perspective) -->
  <g opacity="0.4" transform="translate(1300, 150)">
    <!-- Rack 1 -->
    <rect x="0" y="0" width="140" height="700" fill="#0B1329" stroke="#1E293B" stroke-width="2"/>
    <line x1="10" y1="50" x2="130" y2="50" stroke="#38BDF8" stroke-width="1" opacity="0.5"/>
    <line x1="10" y1="120" x2="130" y2="120" stroke="#38BDF8" stroke-width="1" opacity="0.5"/>
    <line x1="10" y1="190" x2="130" y2="190" stroke="#38BDF8" stroke-width="1" opacity="0.5"/>
    <line x1="10" y1="260" x2="130" y2="260" stroke="#38BDF8" stroke-width="1" opacity="0.5"/>
    <line x1="10" y1="330" x2="130" y2="330" stroke="#38BDF8" stroke-width="1" opacity="0.5"/>
    <line x1="10" y1="400" x2="130" y2="400" stroke="#38BDF8" stroke-width="1" opacity="0.5"/>
    <line x1="10" y1="470" x2="130" y2="470" stroke="#38BDF8" stroke-width="1" opacity="0.5"/>
    <!-- LED Blinks -->
    <circle cx="25" cy="50" r="3" fill="#10B981" filter="url(#nodeGlow)"/>
    <circle cx="45" cy="50" r="3" fill="#06B6D4"/>
    <circle cx="25" cy="120" r="3" fill="#10B981"/>
    <circle cx="45" cy="120" r="3" fill="#38BDF8"/>
    <circle cx="25" cy="260" r="3" fill="#06B6D4"/>
    <circle cx="45" cy="260" r="3" fill="#10B981"/>

    <!-- Rack 2 -->
    <rect x="180" y="40" width="140" height="660" fill="#090E1F" stroke="#1E293B" stroke-width="2"/>
    <line x1="190" y1="90" x2="310" y2="90" stroke="#1D4ED8" stroke-width="1" opacity="0.4"/>
    <line x1="190" y1="160" x2="310" y2="160" stroke="#1D4ED8" stroke-width="1" opacity="0.4"/>
    <line x1="190" y1="230" x2="310" y2="230" stroke="#1D4ED8" stroke-width="1" opacity="0.4"/>
    <!-- LEDs -->
    <circle cx="205" cy="90" r="3" fill="#06B6D4"/>
    <circle cx="225" cy="90" r="3" fill="#10B981"/>
    <circle cx="205" cy="160" r="3" fill="#1D4ED8"/>
  </g>

  <!-- Multiple Glowing Curved Monitors in Center-Right -->
  <g transform="translate(1020, 260)">
    <!-- Main Center Monitor -->
    <rect x="120" y="40" width="400" height="250" rx="8" fill="#050C1F" stroke="#06B6D4" stroke-width="2" filter="url(#neonGlow)"/>
    <!-- Code Lines on Main Monitor -->
    <line x1="150" y1="80" x2="300" y2="80" stroke="#06B6D4" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="105" x2="420" y2="105" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="180" y1="130" x2="380" y2="130" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="180" y1="155" x2="320" y2="155" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <line x1="150" y1="180" x2="460" y2="180" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <line x1="150" y1="205" x2="260" y2="205" stroke="#06B6D4" stroke-width="3" stroke-linecap="round"/>
    <line x1="180" y1="230" x2="400" y2="230" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Left Angled Monitor -->
    <polygon points="-40,70 100,50 100,280 -40,290" fill="#04091A" stroke="#1D4ED8" stroke-width="1.8" filter="url(#neonGlow)"/>
    <line x1="-15" y1="100" x2="70" y2="90" stroke="#38BDF8" stroke-width="3" opacity="0.7"/>
    <line x1="-15" y1="125" x2="85" y2="115" stroke="#06B6D4" stroke-width="2.5" opacity="0.8"/>
    <line x1="5" y1="150" x2="75" y2="140" stroke="#1D4ED8" stroke-width="2.5"/>
    <line x1="-15" y1="175" x2="90" y2="165" stroke="#38BDF8" stroke-width="2.5" opacity="0.7"/>
    <line x1="-15" y1="200" x2="60" y2="190" stroke="#10B981" stroke-width="2.5"/>

    <!-- Right Angled Monitor -->
    <polygon points="540,60 680,80 680,300 540,285" fill="#04091A" stroke="#38BDF8" stroke-width="1.8" filter="url(#neonGlow)"/>
    <line x1="560" y1="105" x2="650" y2="115" stroke="#06B6D4" stroke-width="3" opacity="0.8"/>
    <line x1="560" y1="130" x2="630" y2="140" stroke="#10B981" stroke-width="2.5"/>
    <line x1="580" y1="155" x2="660" y2="165" stroke="#38BDF8" stroke-width="2.5" opacity="0.7"/>
    <line x1="560" y1="180" x2="645" y2="190" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>

    <!-- Top Floating Holographic HUD Panel -->
    <rect x="180" y="-80" width="280" height="90" rx="4" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="8 4" opacity="0.6"/>
    <circle cx="220" cy="-35" r="20" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
    <line x1="260" y1="-50" x2="430" y2="-50" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
    <line x1="260" y1="-30" x2="380" y2="-30" stroke="#06B6D4" stroke-width="2" opacity="0.7"/>
    <line x1="260" y1="-10" x2="410" y2="-10" stroke="#1D4ED8" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Silhouette of Hooded Programmer From Behind -->
  <g transform="translate(1260, 480)">
    <!-- Shoulders / Torso -->
    <path d="M-80,260 C-60,160 -10,120 60,110 C130,120 180,160 200,260 Z" fill="#040817" stroke="#1E293B" stroke-width="2"/>
    <!-- Hood -->
    <path d="M10,115 C-20,60 0,0 60,-20 C120,0 140,60 110,115 C85,125 35,125 10,115 Z" fill="#020612" stroke="#06B6D4" stroke-width="1" opacity="0.9"/>
    <!-- Rim Light Cyan Reflection on Hood & Shoulders -->
    <path d="M-50,210 C-30,150 10,125 60,115" stroke="#06B6D4" stroke-width="2.5" fill="none" opacity="0.75" filter="url(#nodeGlow)"/>
    <path d="M170,210 C150,150 110,125 60,115" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.75" filter="url(#nodeGlow)"/>
    <path d="M15,90 C-2,50 15,10 60,-12 C105,10 122,50 105,90" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.8"/>
  </g>

  <!-- Large Cybersecurity Vector Network Constellation Top-Left & Ambient -->
  <g stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.5" transform="translate(40, 40)">
    <circle cx="80" cy="100" r="5" fill="#38BDF8" filter="url(#nodeGlow)"/>
    <circle cx="240" cy="60" r="6" fill="#06B6D4" filter="url(#nodeGlow)"/>
    <circle cx="380" cy="160" r="7" fill="#38BDF8" filter="url(#nodeGlow)"/>
    <circle cx="560" cy="90" r="5" fill="#1D4ED8"/>
    <circle cx="160" cy="300" r="5" fill="#38BDF8"/>
    <circle cx="320" cy="380" r="7" fill="#06B6D4" filter="url(#nodeGlow)"/>
    <circle cx="480" cy="290" r="6" fill="#38BDF8"/>

    <line x1="80" y1="100" x2="240" y2="60"/>
    <line x1="240" y1="60" x2="380" y2="160"/>
    <line x1="380" y1="160" x2="560" y2="90"/>
    <line x1="80" y1="100" x2="160" y2="300"/>
    <line x1="160" y1="300" x2="320" y2="380"/>
    <line x1="320" y1="380" x2="480" y2="290"/>
    <line x1="380" y1="160" x2="480" y2="290"/>
    <line x1="240" y1="60" x2="320" y2="380" stroke-dasharray="6 3"/>
  </g>

  <!-- Foreground Dark Gradient Overlay ensuring 100% left text readability -->
  <rect width="1920" height="1080" fill="url(#leftDarkOverlay)" />
  <defs>
    <linearGradient id="leftDarkOverlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#030712" stop-opacity="0.96"/>
      <stop offset="42%" stop-color="#030712" stop-opacity="0.82"/>
      <stop offset="68%" stop-color="#030712" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
